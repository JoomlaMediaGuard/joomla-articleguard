PLG_SYSTEM_ARTICLEGUARD="System - ArticleGuard"
PLG_SYSTEM_ARTICLEGUARD_XML_DESCRIPTION="ArticleGuard - Blocks the ability to edit and modify articles based on their publication state for selected user groups."

; Configuration in the administrator panel
PLG_SYSTEM_ARTICLEGUARD_FIELD_PROTECTED_STATES_LABEL="Protected Article States"
PLG_SYSTEM_ARTICLEGUARD_FIELD_PROTECTED_STATES_DESC="Select article states that should be protected from editing. Articles in the states selected here will be locked for all users outside the privileged groups."
PLG_SYSTEM_ARTICLEGUARD_FIELD_PROTECTED_STATES_ERROR="An invalid article state was selected."
PLG_SYSTEM_ARTICLEGUARD_FIELD_STATES_OP_PUBLISHED="Published"
PLG_SYSTEM_ARTICLEGUARD_FIELD_STATES_OP_UNPUBLISHED="Unpublished"
PLG_SYSTEM_ARTICLEGUARD_FIELD_STATES_OP_ARCHIVED="Archived"
PLG_SYSTEM_ARTICLEGUARD_FIELD_STATES_OP_TRASHED="Trashed"

PLG_SYSTEM_ARTICLEGUARD_FIELD_PRIVILEGED_GROUPS_LABEL="Groups free from restrictions"
PLG_SYSTEM_ARTICLEGUARD_FIELD_PRIVILEGED_GROUPS_DESC="Select user groups that can bypass protection and edit articles in protected states. Users outside these groups will not be able to edit or change the state of protected articles."
PLG_SYSTEM_ARTICLEGUARD_FIELD_PRIVILEGED_GROUPS_ERROR="An invalid user group was selected."

PLG_SYSTEM_ARTICLEGUARD_FIELD_LOG_ENABLED_LABEL="Enable Decision Logging"
PLG_SYSTEM_ARTICLEGUARD_FIELD_LOG_ENABLED_DESC="Enables detailed logging of every plugin decision (allow or block) in the administrator/logs/plg_articleguard.log.php log file."
PLG_SYSTEM_ARTICLEGUARD_FIELD_LOG_ENABLED_ERROR="Invalid logging value. Please select Yes or No."

; Messages in the user interface (Edit form and POST Block)
PLG_SYSTEM_ARTICLEGUARD_FORM_LOCKED_MSG="This article has been locked for editing due to its protected publication state. Content is read-only."
PLG_SYSTEM_ARTICLEGUARD_SAVE_DENIED_MSG="No permission to modify this article due to its publication state. Please close the edit form"
PLG_SYSTEM_ARTICLEGUARD_STATE_DENIED_MSG="No permission to change the publication state of the selected articles."
